name: Android library catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  libraries:
    name: ${{ matrix.os }} / NDK ${{ matrix.ndk }} / ${{ matrix.abi }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, macos-15, windows-2022, windows-2025]
        ndk: [27.2.12479018, 28.2.13676358]
        abi: [arm64-v8a]
        triplet: [arm64-android]
        include:
          - {os: ubuntu-24.04, ndk: 28.2.13676358, abi: armeabi-v7a, triplet: arm-neon-android}
          - {os: ubuntu-24.04, ndk: 28.2.13676358, abi: x86, triplet: x86-android}
          - {os: ubuntu-24.04, ndk: 28.2.13676358, abi: x86_64, triplet: x64-android}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/out/cache,readwrite
      VCPKG_MAX_CONCURRENCY: 3
      XMAKE_ROOT: y
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install selected NDK
        run: |
          sdkmanager "ndk;${{ matrix.ndk }}"
          python -c "import os; from pathlib import Path; p=Path(os.environ['ANDROID_HOME'])/'ndk'/'${{ matrix.ndk }}'; open(os.environ['GITHUB_ENV'],'a').write('ANDROID_NDK_HOME='+p.as_posix()+'\n')"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.9'
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 817892b0ecbc6af994dd6df999c73faf795adbf2
          path: .ci-vcpkg
      - uses: actions/cache@v4
        with:
          path: out/cache
          key: android-${{ matrix.os }}-${{ matrix.ndk }}-${{ matrix.abi }}-${{ hashFiles('ci/**') }}
          restore-keys: android-${{ matrix.os }}-${{ matrix.ndk }}-${{ matrix.abi }}-
      - name: Bootstrap vcpkg
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            MSYS_NO_PATHCONV=1 cmd.exe /c '.ci-vcpkg\bootstrap-vcpkg.bat -disableMetrics'
          else
            bash .ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
      - name: Build catalog and dependencies for Android
        run: |
          mkdir -p out
          .ci-vcpkg/vcpkg install --triplet=${{ matrix.triplet }} --overlay-triplets="$PWD/ci/triplets" --x-manifest-root="$PWD/ci" --x-install-root="$PWD/out/installed" --keep-going 2>&1 | tee out/vcpkg.log
      - name: Build libkev Gear-Lib Box2D and tbox
        if: ${{ !cancelled() }}
        run: python ci/build_extra.py --ndk "$ANDROID_NDK_HOME" --abi "${{ matrix.abi }}"
      - name: Build libevent Android demo against installed library
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B out/demo -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 -DLIBEVENT_ROOT="$PWD/out/installed/${{ matrix.triplet }}"
          cmake --build out/demo --parallel 3
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-${{ matrix.os }}-ndk${{ matrix.ndk }}-${{ matrix.abi }}
          path: |
            out/installed/${{ matrix.triplet }}/include
            out/installed/${{ matrix.triplet }}/lib
            out/installed/${{ matrix.triplet }}/share/**/copyright
            out/extra/*/include
            out/extra/*/lib
            out/extra/results.json
            out/demo/libevent_demo*
            out/vcpkg.log
            .ci-vcpkg/buildtrees/**/*.log
          retention-days: 7
